name: Gecko recon
on:
  push:
    paths: [".github/workflows/gecko-recon.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Baixar e inspecionar GeckoView
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir work && cd work
          curl -sS https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/maven-metadata.xml > meta.xml
          VER=$(grep -oP '(?<=<release>)[^<]+' meta.xml || true)
          [ -z "$VER" ] && VER=$(grep -oP '(?<=<latest>)[^<]+' meta.xml)
          echo "VERSION=$VER" > out.txt
          grep -o '<version>[^<]*' meta.xml | tail -8 >> out.txt
          curl -sS -L -o g.aar "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/$VER/geckoview-arm64-v8a-$VER.aar"
          ls -la g.aar >> out.txt
          mkdir x && cd x && unzip -q ../g.aar classes.jar && cd ..
          for c in GeckoSession 'GeckoSession$NavigationDelegate' 'GeckoSession$ProgressDelegate' 'GeckoSession$ContentDelegate' 'GeckoSession$ContentDelegate$ContextElement' 'GeckoSession$PromptDelegate' 'GeckoSession$PromptDelegate$AlertPrompt' 'GeckoSession$PromptDelegate$ButtonPrompt' 'GeckoSession$PromptDelegate$TextPrompt' 'GeckoSession$PromptDelegate$FilePrompt' 'GeckoSession$PromptDelegate$BasePrompt' 'GeckoSession$SessionState' 'GeckoSession$NavigationDelegate$LoadRequest' GeckoSessionSettings 'GeckoSessionSettings$Builder' GeckoRuntime GeckoRuntimeSettings 'GeckoRuntimeSettings$Builder' GeckoView 'ContentBlocking$Delegate' 'ContentBlocking$Settings' 'ContentBlocking$Settings$Builder' 'ContentBlocking$ContentBlockingEvent' 'GeckoSession$ContentBlockingDelegate' WebResponse GeckoResult; do
            echo "=== $c" >> out.txt
            javap -public -cp x/classes.jar "org.mozilla.geckoview.$c" >> out.txt 2>&1 || true
          done
          cd ..
          mkdir logrepo && cd logrepo
          git init -q -b logs-xok
          cp ../work/out.txt log.txt
          git add log.txt
          git -c user.name=ci -c user.email=ci@example.com commit -q -m recon
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" logs-xok
