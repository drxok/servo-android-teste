name: Compilar Servo (Android)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/servo-android.yml"
  workflow_dispatch:
    inputs:
      servo_ref:
        description: "Versão do Servo (branch ou tag)"
        default: "main"
      ndk_version:
        description: "Versão do NDK do Android"
        default: "29.0.14206865"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SERVO_REF: ${{ inputs.servo_ref || 'main' }}
      NDK_VERSION: ${{ inputs.ndk_version || '29.0.14206865' }}
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Liberar espaço em disco
        run: |
          exec > >(tee -a "$RUNNER_TEMP/full.log") 2>&1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Criar memória de troca (swap)
        run: |
          exec > >(tee -a "$RUNNER_TEMP/full.log") 2>&1
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Baixar o código do Servo
        run: |
          exec > >(tee -a "$RUNNER_TEMP/full.log") 2>&1
          git clone --depth 1 --branch "$SERVO_REF" https://github.com/servo/servo.git servo

      - name: Instalar SDK e NDK do Android
        run: |
          exec > >(tee -a "$RUNNER_TEMP/full.log") 2>&1
          ls "$ANDROID_SDK_ROOT" || true
          java -version
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado, baixando as ferramentas..."
            curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdtools.zip -d cmdtools-tmp
            sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
            sudo rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            sudo mv cmdtools-tmp/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          sudo chown -R "$USER" "$ANDROID_SDK_ROOT"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --list_installed || true
          for pkg in "build-tools;36.0.0" "platform-tools" "platforms;android-37.0" "ndk;$NDK_VERSION"; do
            echo "Instalando $pkg"
            "$SDKMANAGER" --install "$pkg"
          done
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Instalar uv
        run: |
          exec > >(tee -a "$RUNNER_TEMP/full.log") 2>&1
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Instalar dependências do Servo
        working-directory: servo
        run: |
          exec > >(tee -a "$RUNNER_TEMP/full.log") 2>&1
          ./mach bootstrap --force

      - name: Compilar para Android
        working-directory: servo
        run: |
          exec > >(tee -a "$RUNNER_TEMP/full.log") 2>&1
          ./mach build --release --android

      - name: Reunir e assinar os APKs
        run: |
          exec > >(tee -a "$RUNNER_TEMP/full.log") 2>&1
          mkdir -p out
          find servo -name '*.apk' -print | tee apks.txt
          if [ ! -s apks.txt ]; then
            echo "Nenhum APK foi gerado. Conteúdo de servo/target:"
            find servo/target -maxdepth 4 -type d | head -50
            exit 1
          fi
          BT="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          keytool -genkeypair -keystore debug.jks -alias servo -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -dname "CN=Servo Teste"
          while read -r f; do
            base="$(basename "$f" .apk)"
            case "$base" in
              *unsigned*)
                "$BT/zipalign" -f 4 "$f" "aligned.apk"
                "$BT/apksigner" sign --ks debug.jks --ks-pass pass:android --out "out/${base}-assinado.apk" aligned.apk
                ;;
              *)
                [ -e "out/${base}.apk" ] || cp "$f" "out/${base}.apk"
                ;;
            esac
          done < apks.txt
          rm -f out/servoapp.apk; ls -la out

      - name: Guardar APK como arquivo da execução
        uses: actions/upload-artifact@v4
        with:
          name: servo-android-apk
          path: out/servoapp-arm64Release.apk
          retention-days: 30
          compression-level: 0

      - name: Publicar APK no Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/full.log") 2>&1
          gh release create "servo-teste-${{ github.run_number }}" out/servoapp-arm64Release.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Servo para Android (teste ${{ github.run_number }})" \
            --notes "Servo ${SERVO_REF}, NDK ${NDK_VERSION}. Instale o APK no celular para testar."

      - name: Guardar o log da falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          mkdir logrepo
          cd logrepo
          git init -q -b logs
          tail -n 400 "$RUNNER_TEMP/full.log" > log.txt || echo "sem log" > log.txt
          git add log.txt
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "log da falha"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" logs
