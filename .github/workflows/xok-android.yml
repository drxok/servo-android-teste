name: Compilar Xok Browser (GeckoView)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xok-android.yml"
      - "xok/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar plataforma do Android
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        run: |
          set -o pipefail
          cd xok
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/full.log"

      - name: Guardar APK
        run: |
          mkdir out
          cp xok/app/build/outputs/apk/release/*.apk out/xok-browser.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: xok-browser-apk
          path: out/xok-browser.apk

      - name: Registrar falha
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          touch "$RUNNER_TEMP/full.log"
          mkdir logrepo
          cd logrepo
          git init -q -b logs-xok
          grep -n -E "^e: |error:|FAILED|What went wrong|Execution failed|Unresolved|wrong" "$RUNNER_TEMP/full.log" | head -80 > log.txt || true
          tail -n 120 "$RUNNER_TEMP/full.log" >> log.txt || echo "sem log" > log.txt
          git add log.txt
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "log da falha do Xok"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" logs-xok
